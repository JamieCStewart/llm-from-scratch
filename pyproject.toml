[project]
name = "llm-from-scratch"
version = "0.1.0"
description = "Temp: Following book How to make an LLM from scratch"
readme = "README.md"
authors = [
    { name = "Jamie Stewart", email = "jamie270401@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "nbstripout>=0.9.1",
    "tiktoken==0.5.1",
]

[project.scripts]
llm-from-scratch = "llm_from_scratch:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pre-commit>=4.7.0",
]
